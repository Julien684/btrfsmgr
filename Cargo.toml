[package]
name = "btrfsmgr"
version = "1.0.15"
edition = "2021"
rust-version = "1.85"
description = "Gestionnaire BTRFS (instantanés, timers systemd, boot) — TUI + CLI"
license = "GPL-3.0-or-later"

[[bin]]
name = "btrfsmgr"
path = "src/main.rs"

[lib]
name = "btrfsmgr"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
opt-level = 3
strip = true
